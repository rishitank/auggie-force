name: Augment Weekly Report

on:
  schedule:
    - cron: '0 13 * * MON'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Aggregate recent run metadata
        uses: actions/github-script@v7
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 50,
              status: 'completed'
            });
            const data = runs.workflow_runs.map(r => ({name: r.name, status: r.conclusion, head_branch: r.head_branch, id: r.id, updated_at: r.updated_at}));
            core.setOutput('json', JSON.stringify(data, null, 2));
      - name: Upload summary artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-augment-summary
          path: |
            ${{ github.workspace }}/
        if-no-files-found: ignore
      - name: Write job summary
        run: |
          echo "# Augment Weekly Summary" >> $GITHUB_STEP_SUMMARY
          echo "Recent completed workflow runs captured. See artifact for details." >> $GITHUB_STEP_SUMMARY

