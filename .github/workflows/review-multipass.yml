name: Augment Review (Multi-Pass)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_target:
    types: [labeled]
    # Only allow safe label triggers
    branches: [ main, master ]

concurrency:
  group: augment-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Infer flags
        id: flags
        run: |
          POEM=false
          PROMPTS=false
          if [[ "${{ toJson(github.event.pull_request.labels.*.name) }}" == *"auggie:poem"* ]]; then POEM=true; fi
          if [[ "${{ toJson(github.event.pull_request.labels.*.name) }}" == *"auggie:agent-prompts"* ]]; then PROMPTS=true; fi
          echo "poem=$POEM" >> $GITHUB_OUTPUT
          echo "prompts=$PROMPTS" >> $GITHUB_OUTPUT

  lint_security_deep:
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        pass: [lint, security, deep]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Augment Review PR
        uses: augmentcode/review-pr@main
        with:
          augment_session_auth: ${{ secrets.AUGMENT_SESSION_AUTH || secrets.AUGMENT_API_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo_name: ${{ github.repository }}
          pull_number: ${{ github.event.pull_request.number }}
          custom_guidelines: |
            {% set PASS = matrix.pass %}
            {% include "templates/base-guidelines.md" %}
            {% if PASS == 'lint' %}
            {% include "templates/lint-guidelines.md" %}
            {% elif PASS == 'security' %}
            {% include "templates/security-guidelines.md" %}
            {% else %}
            {% include "templates/deep-guidelines.md" %}
            {% endif %}
            {% if needs.prepare.outputs.poem == 'true' %}
            {% include "templates/poem.md" %}
            {% endif %}
            {% if needs.prepare.outputs.prompts == 'true' %}
            {% include "templates/agent-prompts.md" %}
            {% endif %}
        env:
          AUGMENT_MODEL: ${{ vars.AUGMENT_MODEL || 'gpt-4.1' }}

  summarize:
    runs-on: ubuntu-latest
    needs: lint_security_deep
    if: always()
    steps:
      - name: Succeed if only advisory issues
        run: |
          echo "This step can parse artifacts or check labels to determine final gate. Placeholder for now."

